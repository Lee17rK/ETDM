<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoDsWithK - Download</title>
    <style>
        /* Base page styling */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Centered content box */
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: 350px;
        }

        /* Top Title Styling */
        .main-title {
            margin: 0 0 25px 0;
            font-size: 42px;
            font-weight: 900;
            font-family: 'Arial Black', Impact, sans-serif;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff0000, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        /* YouTube Buttons Row */
        .yt-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .yt-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
        }

        .yt-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .btn-subscribe { background-color: #ff0000; box-shadow: 0 4px 10px rgba(255, 0, 0, 0.4); }
        .btn-like { background-color: #3ea6ff; box-shadow: 0 4px 10px rgba(62, 166, 255, 0.4); }
        .btn-share { background-color: transparent; border: 2px solid #3ea6ff; color: #3ea6ff; padding: 8px 16px; }

        /* Animated Download Button */
        .download-btn {
            display: inline-block;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s infinite; 
            cursor: pointer;
            width: 80%;
        }

        .download-btn:hover {
            transform: scale(1.05);
            animation: none;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
        }

        /* Custom File Name text inside the button */
        .file-name {
            display: block;
            font-size: 13px;
            font-weight: normal;
            margin-top: 6px;
            text-transform: none;
            opacity: 0.9;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">MoDsWithK</h1>
        
        <div class="yt-buttons">
            <a href="https://youtube.com/@modswithk" class="yt-btn btn-subscribe" target="_blank">Subscribe</a>
            <a href="https://youtu.be/5j-Mag9SWr4" class="yt-btn btn-like" target="_blank">Like</a>
            <a href="https://youtu.be/5j-Mag9SWr4" class="yt-btn btn-share" target="_blank">Share</a>
        </div>

        <!-- The ID tags allow JS to inject the real file details here automatically -->
        <a href="https://www.mediafire.com/file/tdmkclqtt80o3i1/Eticket-Tofask-v136(MoDsWithK)File.apk/file" id="auto-download-btn" class="download-btn" target="_blank">
            Download
            <span id="auto-file-info" class="file-name">Fetching file info...</span>
        </a>

    </div>

    <footer style="position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: #555;">
        &copy; 2026 MoDsWithK | All custom modifications are thoroughly tested.
    </footer>

    <!-- Stronger JavaScript to automatically fetch file name and size -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const btn = document.getElementById("auto-download-btn");
            const infoSpan = document.getElementById("auto-file-info");
            const mediafireUrl = btn.href;

            // Using the 'raw' endpoint to bypass JSON parsing issues
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(mediafireUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network response failed");
                const htmlString = await response.text();

                // 1. Extract File Name using Regex (scans the meta tags directly)
                let fileName = "Download File";
                const titleMatch = htmlString.match(/<meta property="og:title" content="([^"]+)"/i) || 
                                   htmlString.match(/<title>(.*?)<\/title>/i);
                
                if (titleMatch && titleMatch[1]) {
                    // Clean up title just in case it says "- MediaFire" at the end
                    fileName = titleMatch[1].replace(' - MediaFire', '').trim();
                }

                // 2. Extract File Size using Regex
                // Looks for "Download (831 MB)" inside the page code
                let fileSize = "";
                const sizeMatch = htmlString.match(/Download\s*\(([^)]+)\)/i) || 
                                  htmlString.match(/File size:\s*<span>([^<]+)<\/span>/i);
                
                if (sizeMatch && sizeMatch[1]) {
                    fileSize = sizeMatch[1];
                }

                // Update the button automatically
                if (fileSize) {
                    infoSpan.textContent = `${fileName} (${fileSize})`;
                } else {
                    infoSpan.textContent = fileName;
                }
                
                btn.setAttribute("download", fileName);

            } catch (error) {
                console.error("Failed to fetch data:", error);
                // Clean fallback without any error text if the user's internet is slow
                infoSpan.textContent = "Click to Download";
            }
        });
    </script>
</body>
</html>
